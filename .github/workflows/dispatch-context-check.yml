name: Dispatch context check

on:
  workflow_dispatch:

permissions: {}

jobs:
  push_only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo push only
  middle:
    needs: push_only
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo middle ran
  implicit_success:
    needs: middle
    if: ${{ needs.middle.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo implicit_success ran
  explicit_not_cancelled:
    needs: middle
    if: ${{ !cancelled() && needs.middle.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo explicit_not_cancelled ran
