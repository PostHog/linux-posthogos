name: Dispatch context check

on:
  workflow_dispatch:

permissions: {}

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print the dispatch context
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HAS_REPOSITORY: ${{ github.event.repository != null }}
          CONDITION: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          EVENT_KEYS: ${{ toJson(github.event) }}
        run: |
          echo "ref=${REF}"
          echo "event.repository present=${HAS_REPOSITORY}"
          echo "event.repository.default_branch=${DEFAULT_BRANCH:-<empty>}"
          echo "ref == refs/heads/<default_branch>: ${CONDITION}"
          printf '%s' "$EVENT_KEYS" | jq -r 'keys | join(",")' | sed 's/^/event keys: /'
