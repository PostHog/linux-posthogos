# Build a release-quality PosthogOS ISO and attach it to the GitHub release.
#
# Caches .pacman-cache/ (~2.4 GB of pacstrap'd packages) so we don't
# re-download all of CachyOS + Arch extras on every build. Cache key is
# hashed off the package list + Dockerfile (changes there potentially
# require different pkg files).
name: Build ISO

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Validate + normalize the release tag
      - name: Validate tag
        id: ver
        run: |
          raw="${{ github.event.release.tag_name }}"
          stripped="${raw#v}"
          if ! [[ "$stripped" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
              echo "::error::Release tag '$raw' isn't a valid version. Expected e.g. 0.1.0, v0.1.0, 1.2.3-rc.1"
              exit 1
          fi
          version="v${stripped}"
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ubuntu-latest ships ~25 GB free. mkarchiso wants ~10 GB for the build
      # tree + ~3 GB for the ISO + ~4 GB combined cache restore. Reclaim ~15 GB
      # by nuking preinstalled toolchains we don't use.
      - name: Free up disk space
        run: |
          echo "Before:" && df -h /
          sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/share/boost \
              "$AGENT_TOOLSDIRECTORY" \
              /opt/hostedtoolcache
          echo "After:"  && df -h /

      # Recursive so upstream/archiso is populated
      - name: Checkout (with upstream submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      # Invalidates cache only when the package list changes or the Dockerfile bootstrap changes
      - name: Restore pacman cache
        uses: actions/cache@v4
        with:
          path: .pacman-cache
          key: pacman-${{ hashFiles('upstream/archiso/packages_desktop.x86_64', 'upstream/archiso/bootstrap_packages.x86_64', 'Dockerfile') }}
          restore-keys: |
            pacman-

      - name: Build ISO
        env:
          # Signing key for posthogos-* pacman packages. Exported as an
          # armored secret-key block (`gpg --armor --export-secret-keys ...`)
          # and stored as a GH Actions secret. The fingerprint is a public
          # value and lives in a repo variable (not a secret).
          # If either is missing under CI, in-container-build.sh hard-fails
          # — see the comment block in that script for the reasoning.
          POSTHOGOS_PACKAGER_KEY: ${{ secrets.POSTHOGOS_PACKAGER_KEY }}
          POSTHOGOS_PACKAGER_KEY_FPR: ${{ vars.POSTHOGOS_PACKAGER_KEY_FPR }}
        run: bin/build
        timeout-minutes: 50

      - name: Show build outputs
        if: always()
        run: |
          echo "=== out/ ==="
          ls -lh out/ 2>/dev/null || echo "(no out/)"
          echo ""
          echo "=== pacman cache ==="
          du -sh .pacman-cache 2>/dev/null || true
          echo ""
          echo "=== disk after build ==="
          df -h /

      # Stamp the version onto the ISO filename so the downloaded asset is immediately identifiable
      - name: Stamp version onto ISO filename
        if: success()
        run: |
          version="${{ steps.ver.outputs.version }}"
          shopt -s nullglob
          for iso in out/*.iso; do
              base=$(basename "$iso" .iso)
              new="out/${base}-${version}.iso"
              echo "renaming $iso → $new"
              mv "$iso" "$new"
          done

      # Attach the ISO to the GitHub release page as a downloadable asset
      - name: Attach ISO to the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          for iso in out/*.iso; do
              echo "uploading $iso → release $tag"
              gh release upload "$tag" "$iso" --clobber
          done

      # Also upload as a workflow artifact for 90 days
      - name: Upload ISO as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: posthogos-${{ steps.ver.outputs.version }}
          path: out/*.iso
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      # ── Pacman repository: publish posthogos-* packages ────────────────
      # The packages + posthogos.db are already built and sitting in
      # out/pkgs/ — in-container-build.sh runs makepkg + repo-add inline
      # so the same .pkg.tar.zst that the ISO pacstrapped is the one we
      # publish (Phase 1.5: ISO and end-user updates can't drift).
      #
      # Hosted at https://posthog.github.io/linux-posthogos/x86_64/ via
      # the gh-pages branch. Existing PosthogOS installs pull from there
      # on `pacman -Syu`.
      - name: Deploy pacman repo to gh-pages
        if: success()
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: out/pkgs
          destination_dir: x86_64
          keep_files: true     # don't wipe historical packages on each release
          commit_message: "release ${{ steps.ver.outputs.version }}: posthogos pacman repo"

      - name: Attach package files to the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          for pkg in out/pkgs/*.pkg.tar.zst; do
              [ -f "$pkg" ] || continue
              echo "uploading $pkg → release $tag"
              gh release upload "$tag" "$pkg" --clobber
          done
