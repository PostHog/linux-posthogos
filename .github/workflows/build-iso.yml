# Build a release-quality PosthogOS ISO and attach it to a GitHub release.
#
# Triggers:
#   push: tags           — normal flow; ref = pushed version tag. Builds into
#                          a draft release for that tag, then publishes it as
#                          the last step. Releases are immutable once
#                          published, so assets must be attached while the
#                          release is still a draft.
#   workflow_dispatch    — manual; the "Use workflow from" branch picker
#                          in the UI selects the branch. The tag is
#                          derived from <branch>.<short-random> so
#                          back-to-back dispatches don't collide.
#                          Creates a draft release for that tag and leaves
#                          it as a draft.
#
# Caches .pacman-cache/ (~2.4 GB of pacstrap'd packages) so we don't
# re-download all of CachyOS + Arch extras on every build. Cache key is
# hashed off the package list + Dockerfile (changes there potentially
# require different pkg files).
name: Build ISO

on:
  push:
    tags:
      - 'v?[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    # No inputs — the branch is picked via the standard "Use workflow from"
    # selector at the top of the Run workflow dialog (resolved as github.ref_name).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    env:
      # x86_64 is the only working target today (Arch + CachyOS publish x86_64 only).
      # Kept as a var so the pacman cache key, the gh-pages repo
      # dir, and bin/build's BUILD_ARCH stay in lockstep. A future arm port
      # adds a matrix here instead of editing scattered hardcodes. NOTE:
      # ubuntu-latest is x86_64; an arm build would need a runs-on arm runner.
      TARGET_ARCH: x86_64
    # mkarchiso alone is ~45-50 min on ubuntu-latest under Rosetta-style
    # cross-emulation; add 5-10 min for the build prelude (build-assets,
    # makepkg ×6) and the post-build cleanup (chmod -R + rm -rf ~10 GB).
    timeout-minutes: 90

    steps:
      # Resolves three values used downstream:
      #   ref          — what to check out
      #   version      — used for ISO filenames + workflow artifact name
      #   release_tag  — target for `gh release upload`
      # Tag push: all three derive from the pushed tag.
      # Dispatch: ref = the picker's branch, version/tag = <branch>.<rand>.
      # The .<rand> suffix (6 hex chars) keeps repeated dispatches from
      # colliding on the same branch. Tag uses '.' separators (not '-') so
      # the resulting pacman pkgver stays valid (pacman pkgver allows
      # alnum + . + _ + +, no dashes).
      - name: Resolve ref + version + release tag
        id: ver
        env:
          # Indirect through env vars: github-context fields (tag/branch
          # names) can carry arbitrary user input, so never interpolate them
          # straight into a run: script. Reference the quoted env vars below.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
              ref="$REF_NAME"
              stripped="${ref#v}"
              if ! [[ "$stripped" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
                  echo "::error::Release tag '$ref' isn't a valid version. Expected e.g. 0.1.0, v0.1.0, 1.2.3-rc.1"
                  exit 1
              fi
              version="v${stripped}"
              release_tag="$ref"
          else
              ref="$REF_NAME"
              # Sanitize: lowercase, anything not alnum-or-dot → dot,
              # collapse repeated dots, trim leading/trailing dots.
              safe_branch=$(echo "$ref" \
                  | tr '[:upper:]' '[:lower:]' \
                  | tr -c 'a-z0-9.' '.' \
                  | sed -E 's/\.+/./g; s/^\.//; s/\.$//')
              rand=$(openssl rand -hex 3)
              version="${safe_branch}.${rand}"
              release_tag="$version"
          fi
          echo "Resolved: ref=$ref version=$version release_tag=$release_tag"
          {
              echo "ref=$ref"
              echo "version=$version"
              echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      # Runs before the build so an already-published (immutable) release
      # fails fast instead of after ~75 min of mkarchiso. Tag pushes get a
      # draft with generated notes, marked prerelease when the version has a
      # suffix (e.g. 1.2.3-rc.1); dispatches get a draft against the branch.
      - name: Ensure draft GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.ver.outputs.release_tag }}
          REF: ${{ steps.ver.outputs.ref }}
        run: |
          tag="$RELEASE_TAG"
          if is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
              if [ "$is_draft" != "true" ]; then
                  echo "::error::Release $tag is already published and immutable; assets can't be attached. Delete it and push the tag again, or create it as a draft."
                  exit 1
              fi
              echo "Draft release $tag already exists; uploading to it."
          elif [ "$EVENT_NAME" = "push" ]; then
              prerelease=()
              [[ "$tag" == *-* ]] && prerelease=(--prerelease)
              echo "Creating draft release $tag..."
              gh release create "$tag" \
                  --verify-tag \
                  --title "$tag" \
                  --draft \
                  --generate-notes \
                  "${prerelease[@]}"
          else
              echo "Creating draft release $tag (target: $REF)..."
              gh release create "$tag" \
                  --target "$REF" \
                  --title "$tag (manual build)" \
                  --draft \
                  --notes "Built from workflow_dispatch against \`$REF\`."
          fi

      # ubuntu-latest ships ~25 GB free. mkarchiso wants ~10 GB for the build
      # tree + ~3 GB for the ISO + ~4 GB combined cache restore. Reclaim ~15 GB
      # by nuking preinstalled toolchains we don't use.
      - name: Free up disk space
        run: |
          echo "Before:" && df -h /
          sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/share/boost \
              "$AGENT_TOOLSDIRECTORY" \
              /opt/hostedtoolcache
          echo "After:"  && df -h /

      # Recursive so upstream/archiso is populated. fetch-tags: PKGBUILDs'
      # pkgver() resolves the release version via `git describe --tags`,
      # which finds nothing under actions/checkout's default fetch-depth=1.
      - name: Checkout (with upstream submodule)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.ver.outputs.ref }}
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      # Invalidates cache only when the package list changes or the Dockerfile bootstrap changes
      - name: Restore pacman cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pacman-cache
          key: pacman-${{ env.TARGET_ARCH }}-${{ hashFiles(format('upstream/archiso/packages_desktop.{0}', env.TARGET_ARCH), format('upstream/archiso/bootstrap_packages.{0}', env.TARGET_ARCH), 'Dockerfile') }}
          restore-keys: |
            pacman-

      - name: Build ISO
        env:
          # Signing key for posthogos-* pacman packages. Exported as an
          # armored secret-key block (`gpg --armor --export-secret-keys ...`)
          # and stored as a GH Actions secret. The fingerprint is a public
          # value and lives in a repo variable (not a secret).
          # If either is missing under CI, in-container-build.sh hard-fails;
          # see the comment block in that script for the reasoning.
          POSTHOGOS_PACKAGER_KEY: ${{ secrets.POSTHOGOS_PACKAGER_KEY }}
          POSTHOGOS_PACKAGER_KEY_FPR: ${{ vars.POSTHOGOS_PACKAGER_KEY_FPR }}
          # Resolved version (e.g. v0.1.0 for releases, main.abc123 for
          # dispatches). Each PKGBUILD's pkgver() honors this as override
          # — avoids needing git to work inside makepkg's subshell, which
          # has flaked under sudo + bind-mounted .git/ in CI.
          POSTHOGOS_PKGVER: ${{ steps.ver.outputs.version }}
          # Target arch for the ISO + posthogos-* packages (see job env).
          BUILD_ARCH: ${{ env.TARGET_ARCH }}
        run: bin/build
        timeout-minutes: 75

      - name: Show build outputs
        if: always()
        run: |
          echo "=== out/ ==="
          ls -lh out/ 2>/dev/null || echo "(no out/)"
          echo ""
          echo "=== pacman cache ==="
          du -sh .pacman-cache 2>/dev/null || true
          echo ""
          echo "=== disk after build ==="
          df -h /

      # Stamp the version onto the ISO filename so the downloaded asset is immediately identifiable
      - name: Stamp version onto ISO filename
        if: success()
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          version="$VERSION"
          shopt -s nullglob
          for iso in out/*.iso; do
              base=$(basename "$iso" .iso)
              new="out/${base}-${version}.iso"
              echo "renaming $iso → $new"
              mv "$iso" "$new"
          done

      # Upload the full ISO as a workflow artifact FIRST, before splitting,
      # because the next step deletes the original when it produces chunks.
      # Workflow artifacts cap per-file at ~10 GB and require GitHub login
      # to download — fine for internal QA, not great for public users.
      - name: Upload full ISO as workflow artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: posthogos-${{ steps.ver.outputs.version }}
          path: out/*.iso
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      # Split the ISO if it's over GitHub's 2 GiB release-asset cap.
      # End user reassembles with: cat posthogos-*.iso.part?? > posthogos.iso
      # Files under 2 GiB pass through untouched so we don't penalize
      # smaller builds (e.g. FAST_BUILD).
      - name: Split oversized ISO for release upload
        if: success()
        run: |
          cd out
          shopt -s nullglob
          max_release_size=$((2 * 1024 * 1024 * 1024))   # GH's 2 GiB cap
          chunk_size=$((1900 * 1024 * 1024))             # 1.9 GiB, margin
          for iso in *.iso; do
              size=$(stat -c%s "$iso")
              if [ "$size" -lt "$max_release_size" ]; then
                  echo "$iso ($size bytes) fits under 2 GiB; no split needed"
                  continue
              fi
              echo "Splitting $iso ($size bytes) into 1.9 GiB chunks"
              # foo.iso → foo.iso.part00, foo.iso.part01, …
              split -b "$chunk_size" -a 2 -d "$iso" "${iso}.part"
              ls -lh "${iso}.part"*
              rm "$iso"
          done

      # Attach ISO chunks (or unsplit ISO if it fit) to the GitHub release.
      # Wraps gh release upload in a retry loop because GitHub's upload API
      # returns transient 5xx errors under load.
      - name: Attach ISO to the release
        id: attach_iso
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          shopt -s nullglob
          full_isos=(out/*.iso)
          chunks=(out/*.iso.part[0-9][0-9])
          assets=("${full_isos[@]}" "${chunks[@]}")
          if [ ${#assets[@]} -eq 0 ]; then
              echo "::error::No ISO or chunks found in out/"
              exit 1
          fi
          upload_with_retry() {
              local tag="$1" asset="$2"
              local attempt
              for attempt in 1 2 3 4 5; do
                  if gh release upload "$tag" "$asset" --clobber; then
                      return 0
                  fi
                  local delay=$((attempt * 10))
                  echo "::warning::Upload of $(basename "$asset") failed (attempt $attempt/5); retrying in ${delay}s..."
                  sleep "$delay"
              done
              echo "::error::Upload of $(basename "$asset") failed after 5 attempts"
              return 1
          }
          for asset in "${assets[@]}"; do
              echo "uploading $asset → release $tag"
              upload_with_retry "$tag" "$asset"
          done
          if [ ${#chunks[@]} -gt 0 ]; then
              echo "uploaded_chunks=true" >> "$GITHUB_OUTPUT"
          else
              echo "uploaded_chunks=false" >> "$GITHUB_OUTPUT"
          fi

      # When the ISO had to be chunked, append a reassembly snippet to the
      # release body so end users see how to rejoin the parts. Idempotent:
      # the snippet is keyed off a marker comment, so re-running the workflow
      # on the same release doesn't stack duplicates.
      - name: Append chunk-reassembly note to release body
        if: success() && steps.attach_iso.outputs.uploaded_chunks == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.release_tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="$RELEASE_TAG"
          version="$VERSION"
          marker="<!-- posthogos:iso-reassembly -->"
          body=$(gh release view "$tag" --json body --jq '.body // ""')
          if printf '%s' "$body" | grep -qF "$marker"; then
              echo "Reassembly snippet already present in release body; skipping."
              exit 0
          fi
          snippet="
          $marker
          ### Downloading the ISO

          The ISO is split into ~1.9 GiB chunks because GitHub release assets cap at 2 GiB. Download all \`posthogos-desktop-linux-${version}.iso.part??\` files attached to this release, then reassemble:

          \`\`\`bash
          cat posthogos-desktop-linux-${version}.iso.part?? > posthogos-desktop-linux-${version}.iso
          \`\`\`

          The chunks are zero-padded and sort lexicographically, so the \`??\` glob handles the order. Then flash the result to a USB with \`dd\`, balenaEtcher, or Rufus.

          PosthogOS team members can pull the unsplit ISO from the build run's \"posthogos-${version}\" workflow artifact (login required)."
          combined=$(printf '%s\n%s\n' "$body" "$snippet")
          # gh release edit consumes --notes for the body
          printf '%s' "$combined" | gh release edit "$tag" --notes-file -
          echo "Appended reassembly snippet to release $tag"

      # ── Pacman repository: publish posthogos-* packages ────────────────
      # The packages + posthogos.db are already built and sitting in
      # out/pkgs/. in-container-build.sh runs makepkg + repo-add inline
      # so the same .pkg.tar.zst that the ISO pacstrapped is the one we
      # publish (Phase 1.5: ISO and end-user updates can't drift).
      #
      # Hosted at https://posthog.github.io/linux-posthogos/x86_64/ via
      # the gh-pages branch. Existing PosthogOS installs pull from there
      # on `pacman -Syu`.
      # ── APT repository: build .deb packages for Debian/Ubuntu ──────────
      # Repackages the portable posthogos-* pacman packages (already in
      # out/pkgs/) into .deb and assembles a signed flat apt repo in out/deb/.
      # Runs natively on the runner (no Arch container needed) — just needs
      # dpkg-dev + apt-utils. The Release is signed with the same packager key.
      - name: Build Debian packages + apt repo
        if: success()
        env:
          POSTHOGOS_PACKAGER_KEY: ${{ secrets.POSTHOGOS_PACKAGER_KEY }}
          POSTHOGOS_PACKAGER_KEY_FPR: ${{ vars.POSTHOGOS_PACKAGER_KEY_FPR }}
          POSTHOGOS_PKGVER: ${{ steps.ver.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dpkg-dev apt-utils zstd
          scripts/build-deb-packages.sh

      # ── RPM repository: build .rpm packages for Fedora/RHEL/openSUSE ────
      # Built in a fedora container (its rpm toolchain — rpmbuild, rpm-sign,
      # createrepo_c — is the most reliable, esp. for signing). noarch, so
      # one rpm serves every basearch. Output → out/rpm/.
      - name: Build RPM packages + dnf repo
        if: success()
        env:
          POSTHOGOS_PACKAGER_KEY: ${{ secrets.POSTHOGOS_PACKAGER_KEY }}
          POSTHOGOS_PACKAGER_KEY_FPR: ${{ vars.POSTHOGOS_PACKAGER_KEY_FPR }}
          POSTHOGOS_PKGVER: ${{ steps.ver.outputs.version }}
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e POSTHOGOS_PKGVER -e POSTHOGOS_PACKAGER_KEY -e POSTHOGOS_PACKAGER_KEY_FPR \
            fedora:latest \
            bash -c 'set -e
              dnf install -y --setopt=install_weak_deps=False \
                rpm-build rpm-sign createrepo_c gnupg2 zstd tar findutils git >/dev/null
              git config --global --add safe.directory /work || true
              scripts/build-rpm-packages.sh'
          # The container writes out/rpm as root; let the runner user read it.
          sudo chown -R "$(id -u):$(id -g)" out/rpm

      # ── Publish all repos to gh-pages in a single commit ───────────────
      # GitHub's built-in "pages build and deployment" fires on every push
      # to gh-pages, so each separate push is a wasted (and racing) Pages
      # build. We clone once, layer in both repos, prune, and push ONE
      # commit → exactly one Pages deployment.
      #
      # Merge semantics (not a clean publish): packages accumulate under
      # <arch>/ (pacman), deb/pool/ (apt) and rpm/ (dnf) — historical versions
      # are kept (downgrade window) but never referenced by posthogos.db / the
      # apt Packages index / the dnf repodata, which only list the current
      # build. The pacman, apt and rpm prunes then trim each to the 2 newest
      # versions per package. .nojekyll is preserved from the existing branch
      # (Pages would otherwise drop dotted paths).
      - name: Publish repos to gh-pages
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          arch="$TARGET_ARCH"
          clone="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$clone"

          # Layer in the pacman repo (merge: overwrite same names, keep the rest).
          mkdir -p "$clone/$arch"
          cp -a out/pkgs/. "$clone/$arch/"

          # Layer in the apt repo under deb/ (new dists/ + Packages overwrite;
          # new pool/ .debs add alongside existing ones).
          mkdir -p "$clone/deb"
          cp -a out/deb/. "$clone/deb/"

          # Layer in the dnf repo under rpm/. repodata filenames are content-
          # hashed (new ones wouldn't overwrite old), so wipe it first; the
          # .rpm files merge alongside existing ones (repomd.xml only lists
          # the current build).
          mkdir -p "$clone/rpm"
          rm -rf "$clone/rpm/repodata"
          cp -a out/rpm/. "$clone/rpm/"

          # Prune superseded packages: keep the 2 newest per package.
          python3 "${GITHUB_WORKSPACE}/scripts/prune-pacman-repo.py" "$clone/$arch" --keep 2
          python3 "${GITHUB_WORKSPACE}/scripts/prune-deb-repo.py" "$clone/deb" --keep 2
          python3 "${GITHUB_WORKSPACE}/scripts/prune-rpm-repo.py" "$clone/rpm" --keep 2

          # Pages must not run Jekyll over the repo (would drop dotted paths).
          touch "$clone/.nojekyll"

          cd "$clone"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release ${VERSION}: posthogos pacman + apt repos"
          # One push → one Pages deployment. Retry once against a concurrent
          # update to the branch.
          git push origin gh-pages || { git pull --rebase origin gh-pages && git push origin gh-pages; }

      - name: Attach package files to the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          upload_with_retry() {
              local tag="$1" asset="$2"
              local attempt
              for attempt in 1 2 3 4 5; do
                  if gh release upload "$tag" "$asset" --clobber; then
                      return 0
                  fi
                  local delay=$((attempt * 10))
                  echo "::warning::Upload of $(basename "$asset") failed (attempt $attempt/5); retrying in ${delay}s..."
                  sleep "$delay"
              done
              echo "::error::Upload of $(basename "$asset") failed after 5 attempts"
              return 1
          }
          for pkg in out/pkgs/*.pkg.tar.zst; do
              [ -f "$pkg" ] || continue
              echo "uploading $pkg → release $tag"
              upload_with_retry "$tag" "$pkg"
          done
          # Debian packages (standalone .debs as backup assets, alongside the apt repo).
          for deb in out/deb/pool/main/p/*/*.deb; do
              [ -f "$deb" ] || continue
              echo "uploading $deb → release $tag"
              upload_with_retry "$tag" "$deb"
          done
          # RPM packages (standalone .rpms as backup assets, alongside the dnf repo).
          for rpm in out/rpm/*.rpm; do
              [ -f "$rpm" ] || continue
              echo "uploading $rpm → release $tag"
              upload_with_retry "$tag" "$rpm"
          done

      # Last step: everything is attached, so publishing (which makes the
      # release immutable) is safe. Dispatch builds stay as drafts.
      - name: Publish the release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
