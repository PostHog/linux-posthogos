# Build a release-quality PosthogOS ISO and attach it to a GitHub release.
#
# Triggers:
#   release: published     — normal flow; ref = release tag, uploads to it.
#   workflow_dispatch      — manual; user supplies ref (tag/branch/SHA) +
#                            optional version label. Creates a draft
#                            release at <version> if one doesn't exist.
#
# Caches .pacman-cache/ (~2.4 GB of pacstrap'd packages) so we don't
# re-download all of CachyOS + Arch extras on every build. Cache key is
# hashed off the package list + Dockerfile (changes there potentially
# require different pkg files).
name: Build ISO

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch, or commit SHA to build from'
        required: true
        type: string
      version:
        description: 'Version label for ISO filenames + release (defaults to ref). Must match semver, e.g. 0.1.0 or v1.2.3-rc.1.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Resolves three values used downstream:
      #   ref          — what to check out (release event: the tag; dispatch: inputs.ref)
      #   version      — semver-normalized "v<x.y.z>" used for ISO filenames + release name
      #   release_tag  — actual tag for `gh release upload`. For the release
      #                  event this is the literal release tag (so we don't
      #                  rewrite "0.1.0" → "v0.1.0" and miss the existing
      #                  release). For dispatch it equals $version.
      - name: Resolve ref + version + release tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
              ref="${{ github.event.release.tag_name }}"
              release_tag="$ref"
              version_input="$ref"
          else
              ref="${{ inputs.ref }}"
              version_input="${{ inputs.version }}"
              [ -z "$version_input" ] && version_input="$ref"
              # Dispatch path: we'll create or reuse a release tagged with the
              # normalized version. The actual git ref can be anything (SHA,
              # branch, tag) — it determines what we build, not what we publish to.
              release_tag="v${version_input#v}"
          fi
          stripped="${version_input#v}"
          if ! [[ "$stripped" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
              echo "::error::Version '$version_input' isn't a valid semver. Expected e.g. 0.1.0, v0.1.0, 1.2.3-rc.1. For workflow_dispatch with a non-tag ref, pass an explicit 'version' input."
              exit 1
          fi
          version="v${stripped}"
          echo "Resolved: ref=$ref version=$version release_tag=$release_tag"
          {
              echo "ref=$ref"
              echo "version=$version"
              echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      # ubuntu-latest ships ~25 GB free. mkarchiso wants ~10 GB for the build
      # tree + ~3 GB for the ISO + ~4 GB combined cache restore. Reclaim ~15 GB
      # by nuking preinstalled toolchains we don't use.
      - name: Free up disk space
        run: |
          echo "Before:" && df -h /
          sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/share/boost \
              "$AGENT_TOOLSDIRECTORY" \
              /opt/hostedtoolcache
          echo "After:"  && df -h /

      # Recursive so upstream/archiso is populated. fetch-tags: PKGBUILDs'
      # pkgver() resolves the release version via `git describe --tags`,
      # which finds nothing under actions/checkout's default fetch-depth=1.
      - name: Checkout (with upstream submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.ref }}
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      # Invalidates cache only when the package list changes or the Dockerfile bootstrap changes
      - name: Restore pacman cache
        uses: actions/cache@v4
        with:
          path: .pacman-cache
          key: pacman-${{ hashFiles('upstream/archiso/packages_desktop.x86_64', 'upstream/archiso/bootstrap_packages.x86_64', 'Dockerfile') }}
          restore-keys: |
            pacman-

      - name: Build ISO
        env:
          # Signing key for posthogos-* pacman packages. Exported as an
          # armored secret-key block (`gpg --armor --export-secret-keys ...`)
          # and stored as a GH Actions secret. The fingerprint is a public
          # value and lives in a repo variable (not a secret).
          # If either is missing under CI, in-container-build.sh hard-fails;
          # see the comment block in that script for the reasoning.
          POSTHOGOS_PACKAGER_KEY: ${{ secrets.POSTHOGOS_PACKAGER_KEY }}
          POSTHOGOS_PACKAGER_KEY_FPR: ${{ vars.POSTHOGOS_PACKAGER_KEY_FPR }}
        run: bin/build
        timeout-minutes: 50

      - name: Show build outputs
        if: always()
        run: |
          echo "=== out/ ==="
          ls -lh out/ 2>/dev/null || echo "(no out/)"
          echo ""
          echo "=== pacman cache ==="
          du -sh .pacman-cache 2>/dev/null || true
          echo ""
          echo "=== disk after build ==="
          df -h /

      # Stamp the version onto the ISO filename so the downloaded asset is immediately identifiable
      - name: Stamp version onto ISO filename
        if: success()
        run: |
          version="${{ steps.ver.outputs.version }}"
          shopt -s nullglob
          for iso in out/*.iso; do
              base=$(basename "$iso" .iso)
              new="out/${base}-${version}.iso"
              echo "renaming $iso → $new"
              mv "$iso" "$new"
          done

      # For workflow_dispatch, the target release might not exist yet.
      # Create a draft if missing; the release event always already has one.
      - name: Ensure GitHub release exists
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.release_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; uploading to it."
          else
              echo "Creating draft release $tag (target: ${{ steps.ver.outputs.ref }})..."
              gh release create "$tag" \
                  --target "${{ steps.ver.outputs.ref }}" \
                  --title "$tag (manual build)" \
                  --draft \
                  --notes "Built from workflow_dispatch against \`${{ steps.ver.outputs.ref }}\`."
          fi

      # Attach the ISO to the GitHub release page as a downloadable asset
      - name: Attach ISO to the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.release_tag }}"
          for iso in out/*.iso; do
              echo "uploading $iso → release $tag"
              gh release upload "$tag" "$iso" --clobber
          done

      # Also upload as a workflow artifact for 90 days
      - name: Upload ISO as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: posthogos-${{ steps.ver.outputs.version }}
          path: out/*.iso
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      # ── Pacman repository: publish posthogos-* packages ────────────────
      # The packages + posthogos.db are already built and sitting in
      # out/pkgs/. in-container-build.sh runs makepkg + repo-add inline
      # so the same .pkg.tar.zst that the ISO pacstrapped is the one we
      # publish (Phase 1.5: ISO and end-user updates can't drift).
      #
      # Hosted at https://posthog.github.io/linux-posthogos/x86_64/ via
      # the gh-pages branch. Existing PosthogOS installs pull from there
      # on `pacman -Syu`.
      - name: Deploy pacman repo to gh-pages
        if: success()
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: out/pkgs
          destination_dir: x86_64
          keep_files: true     # don't wipe historical packages on each release
          commit_message: "release ${{ steps.ver.outputs.version }}: posthogos pacman repo"

      - name: Attach package files to the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.release_tag }}"
          for pkg in out/pkgs/*.pkg.tar.zst; do
              [ -f "$pkg" ] || continue
              echo "uploading $pkg → release $tag"
              gh release upload "$tag" "$pkg" --clobber
          done
