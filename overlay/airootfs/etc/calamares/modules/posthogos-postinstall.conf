# PosthogOS Calamares postinstall hook.
#
# Installs the PosthogOS stack onto the freshly pacstrapped target and runs
# the shared system tweaks (posthogos-apply-common). Registered as a
# shellprocess instance and slotted into the exec sequence by
# scripts/posthogos-customize.sh.
#
# dontChroot: true — the command runs in the live environment and reaches
# into the target via arch-chroot; ${ROOT} is the target mount point.
# timeout: 3600 — pacman -Sy over the network plus the plymouth
# `mkinitcpio -P` regen inside apply-common can take several minutes.
---
dontChroot: true
timeout: 3600
script:
    - command: "/etc/calamares/scripts/posthogos-postinstall ${ROOT}"
      verbose: true
    - "-rm /etc/calamares/scripts/posthogos-postinstall"

i18n:
    name: "Installing PosthogOS branding and customizations"
