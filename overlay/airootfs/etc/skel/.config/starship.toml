# PosthogOS Starship prompt config.
#
# Brand palette mapped to prompt segments:
#   directory     #1D4AFF (brand blue)
#   git           #EB9D2A (warm honey — same as our selection/accent color)
#   errors        #F54E00 (brand red, reserved for destructive/error states)
#   success       #2EA043 (brand green)
#   muted         dim
#
# Layout: single-line prompt by default. Long path + git + runtime version
# segments wrap to a second line only if the cumulative length exceeds the
# terminal width.
#
# Reference: https://starship.rs/config

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

right_format = """
$python\
$nodejs\
$rust\
$golang\
$bun\
$package"""

add_newline = false

# ─── Prompt symbol ────────────────────────────────────────────────────────
# ❯ on success (orange/honey), red on non-zero exit.
[character]
success_symbol = "[❯](#EB9D2A bold)"
error_symbol   = "[❯](#F54E00 bold)"
vimcmd_symbol  = "[❮](#1D4AFF bold)"

# ─── Directory ────────────────────────────────────────────────────────────
[directory]
style = "#1D4AFF bold"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " "
read_only_style = "#F54E00"

# ─── Git branch / state / status ──────────────────────────────────────────
[git_branch]
symbol = " "
style = "#EB9D2A"
format = "[$symbol$branch]($style) "

[git_state]
style = "#F54E00 bold"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "#EB9D2A"
format = "[$all_status$ahead_behind]($style) "
conflicted = "✘"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ─── Command duration (shown only if cmd took > 2s) ───────────────────────
[cmd_duration]
style = "dim"
min_time = 2_000
format = "[took $duration]($style) "

# ─── Language runtimes (shown on the right when relevant) ─────────────────
[python]
symbol = " "
style = "#1D4AFF"
format = "[$symbol$pyenv_prefix($version )(\\($virtualenv\\) )]($style)"

[nodejs]
symbol = " "
style = "#2EA043"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "#F54E00"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "#00B5C5"
format = "[$symbol($version )]($style)"

[bun]
symbol = " "
style = "#EB9D2A"
format = "[$symbol($version )]($style)"

[package]
disabled = true   # avoid noise — show package version only when explicitly asked
