# Ensure liveuser's home + XDG base dirs exist with correct ownership at
# every boot. systemd-tmpfiles --create runs early in boot, before any user
# session, so KDE's ksycoca cache and other apps can write to ~/.cache,
# ~/.config, etc. without permission errors.
#
# Background: our chroot customize hook tries to `chown -R liveuser` on
# /home/liveuser, but the result isn't visible at runtime — either
# `id liveuser` fails during pacstrap chroot (nsswitch not fully primed),
# or a later package post-install re-creates the dirs as root. tmpfiles
# is bulletproof against both.
#
# Type d: create dir if missing, set ownership + mode
# Type Z: recursively reset ownership + mode (whether or not dir is new)
#
# Type  Path                              Mode  Owner     Group     Age  Argument

d  /home/liveuser                       0755  liveuser  liveuser  -    -
d  /home/liveuser/.cache                0755  liveuser  liveuser  -    -
d  /home/liveuser/.config               0755  liveuser  liveuser  -    -
d  /home/liveuser/.local                0755  liveuser  liveuser  -    -
d  /home/liveuser/.local/share          0755  liveuser  liveuser  -    -
d  /home/liveuser/.local/state          0755  liveuser  liveuser  -    -
d  /home/liveuser/Desktop               0755  liveuser  liveuser  -    -
d  /home/liveuser/Documents             0755  liveuser  liveuser  -    -
d  /home/liveuser/Downloads             0755  liveuser  liveuser  -    -
d  /home/liveuser/Pictures              0755  liveuser  liveuser  -    -

# Recursive chown — fixes anything that's already in /home/liveuser owned
# by root (this is what breaks our current ISO).
Z  /home/liveuser                       -     liveuser  liveuser  -    -
