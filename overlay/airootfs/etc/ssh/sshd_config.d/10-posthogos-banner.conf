# PosthogOS SSH banner.
#
# sshd_config drop-in. OpenSSH's default sshd_config on Arch sources
# /etc/ssh/sshd_config.d/*.conf so we don't have to patch the main file.
#
# `Banner` tells sshd to print the contents of a file BEFORE authentication
# (so the user sees the PostHog brand even on a failed login). For after-
# login content (welcome + tips), that's /etc/motd via PrintMotd which is
# already on by default.
Banner /etc/issue.net
