<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  PostHogOS font policy.

  RoundHog (PostHog's brand typeface, shipped by posthogos-branding under
  /usr/share/fonts/posthogos/) is the default sans-serif for the whole system.
  The explicit KDE/GTK/SDDM/GNOME settings already name "RoundHog", but this
  file covers two remaining cases:

    1. Apps that request the generic "sans-serif" family (many GTK and web
       surfaces) — resolve those to RoundHog first.
    2. Glyphs RoundHog does not cover — fall through to Inter (broad Latin,
       inter-font package) and then Noto Sans (full Unicode / CJK), so text
       never renders as tofu. fontconfig fallback is per-missing-glyph, so
       RoundHog is used wherever it can be and the fallbacks fill the gaps.
-->
<fontconfig>
  <!-- Generic sans-serif → RoundHog, then Latin/Unicode fallbacks. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>RoundHog</family>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- When RoundHog is asked for by name, append the same fallbacks for any
       glyphs it lacks rather than an arbitrary system face. -->
  <alias>
    <family>RoundHog</family>
    <default>
      <family>Inter</family>
      <family>Noto Sans</family>
    </default>
  </alias>
</fontconfig>
